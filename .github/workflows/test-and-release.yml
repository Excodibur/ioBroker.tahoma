name: Build, Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - "*"
        tags:
            # normal versions
            - "v[0-9]+.[0-9]+.[0-9]+"
            # pre-releases
            - "v[0-9]+.[0-9]+.[0-9]+-**"
    pull_request: {}

jobs:
    # Performs quick checks before the expensive test runs
    check:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci

    # ===================

    # Runs unit tests on all supported node versions and OSes
    unit-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check]

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci

            - name: Run component tests
              run: npm run test
              env:
                  CI: true
                  
    integration-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check]

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                os: [ubuntu-latest, macos-latest]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: npm ci
              
            - name: Run integration tests on Linux/OSX env
              run: npm run test:integration:complete
              env:
                  CI: true

    # ===================

    # Deploys the final package to NPM
    deploy:
        # Trigger this step only when a commit on master is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        needs: [unit-tests, integration-tests]

        # id-token is required for npm trusted publishing (OIDC), contents for creating the Github release
        permissions:
            contents: write
            id-token: write

        runs-on: ubuntu-latest
        strategy:
            matrix:
                # trusted publishing requires npm >= 11.5.1, which ships with Node.js 24
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  registry-url: https://registry.npmjs.org

            - name: Extract the version and commit body from the tag
              id: extract_release
              # The body may be multiline, therefore it is written with a delimiter
              run: |
                  VERSION="${{ github.ref }}"
                  VERSION=${VERSION##*/v}
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  {
                      echo "BODY<<EOF_RELEASE_BODY"
                      git show -s --format=%b
                      echo "EOF_RELEASE_BODY"
                  } >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: npm ci

            # Uses npm trusted publishing, no NPM_TOKEN needed.
            # Requires a trusted publisher for this repository and workflow on npmjs.com
            - name: Publish package to npm
              run: npm publish

            - name: Create Github Release
              uses: actions/create-release@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: ${{ github.ref }}
                release_name: Release v${{ steps.extract_release.outputs.VERSION }}
                draft: false
                # Prerelease versions create prereleases on Github
                prerelease: ${{ contains(steps.extract_release.outputs.VERSION, '-') }}
                body: ${{ steps.extract_release.outputs.BODY }}
